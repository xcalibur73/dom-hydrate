[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dom-hydrate"
version = "1.3.0"
description = "Forensic CSR vs SSR SEO diff engine and dynamic DOM integrity tracer"
readme = "README.md"
authors = [
  { name = "xcalibur73" }
]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    # PolyForm Noncommercial 1.0.0
    "License :: Free For Educational Use",
    "License :: Free For Non-commercial Use",
    "Operating System :: OS Independent",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
    "Topic :: Software Development :: Quality Assurance"
]
requires-python = ">=3.10"
dependencies = [
    "requests>=2.28.0",
    "beautifulsoup4>=4.12.0",
    "rich>=13.0.0",
    "playwright>=1.40.0"
]

[project.scripts]
dom-hydrate = "dom_hydrate.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["dom_hydrate*"]
exclude = ["assets*", "tests*"]

[project.urls]
"Homepage" = "https://github.com/xcalibur73/dom-hydrate"
"Cloud Engine" = "https://webaudits.pro/tools/hydration-audit"
"Bug Tracker" = "https://github.com/xcalibur73/dom-hydrate/issues"
